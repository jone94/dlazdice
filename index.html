<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101313">
  <meta name="description" content="Celoobrazovková číselná mřížka.">
  <title>Číselná mřížka</title>
  <style>
    :root {
      color-scheme: dark;
      background: #101313;
      --gap: clamp(2px, .8vw, 7px);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body { background: #101313; }
    .grid {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      gap: var(--gap);
      padding: var(--gap);
    }
    .tile {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: clamp(5px, 2vw, 15px);
      background: #191e1d;
      color: #edf0e9;
      font: 750 clamp(12px, 5vw, 26px)/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition: background-color .13s, color .13s, transform .13s, border-color .13s;
    }
    .tile:active { transform: scale(.94); }
    .tile.is-selected {
      color: #17200d;
      background: #c7f36b;
      border-color: #c7f36b;
    }
    .tile:focus-visible { outline: 3px solid white; outline-offset: -4px; }
    @media (prefers-reduced-motion: reduce) {
      .tile { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="grid" id="grid" aria-label="Číselné dlaždice"></main>
  <script>
    // Rozměry mřížky změň zde. Sloupce × řádky = celkový počet dlaždic.
    const COLUMNS = 5;
    const ROWS = 10;

    const grid = document.querySelector('#grid');
    grid.style.setProperty('--cols', COLUMNS);
    grid.style.setProperty('--rows', ROWS);

    for (let number = 1; number <= COLUMNS * ROWS; number++) {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.type = 'button';
      tile.textContent = number;
      tile.setAttribute('aria-label', `Dlaždice ${number}`);
      tile.setAttribute('aria-pressed', 'false');
      tile.addEventListener('click', () => {
        grid.querySelector('.is-selected')?.classList.remove('is-selected');
        grid.querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed', 'false');
        tile.classList.add('is-selected');
        tile.setAttribute('aria-pressed', 'true');
      });
      grid.append(tile);
    }
  </script>
</body>
</html>
